# =============================================================================
# AI YouTube Auto Clipper — Development Docker Compose
# =============================================================================
# Usage:
#   docker compose up -d                # Start all services
#   docker compose --profile workers up # Start with workers
#   docker compose down -v              # Tear down + remove volumes
# =============================================================================

version: '3.8'

services:
  # =========================================================================
  # DATABASE: PostgreSQL 16
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: clip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clipuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clippass}
      POSTGRES_DB: ${POSTGRES_DB:-clipdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clip-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clipuser} -d ${POSTGRES_DB:-clipdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================================
  # QUEUE / CACHE: Redis 7
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: clip-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redispass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - clip-internal
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================================
  # API: NestJS Backend (REST + WebSocket)
  # =========================================================================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: runner
    container_name: clip-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-clipuser}:${POSTGRES_PASSWORD:-clippass}@postgres:5432/${POSTGRES_DB:-clipdb}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      STORAGE_LOCAL_PATH: /app/storage
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      WHISPER_ENDPOINT: ${WHISPER_ENDPOINT:-http://worker-transcribe:5555}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 100
    volumes:
      # Dev: mount source for hot reload
      - ./apps/api/src:/app/apps/api/src:ro
      - ./packages/shared/src:/app/packages/shared/src:ro
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clip-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # =========================================================================
  # WEB: Next.js 15 Frontend
  # =========================================================================
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: runner
    container_name: clip-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - clip-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # =========================================================================
  # WORKER: Download (yt-dlp + FFmpeg)
  # =========================================================================
  worker-download:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker-download
    container_name: clip-worker-download
    restart: unless-stopped
    profiles: ["workers"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-clipuser}:${POSTGRES_PASSWORD:-clippass}@postgres:5432/${POSTGRES_DB:-clipdb}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      STORAGE_LOCAL_PATH: /app/storage
      STORAGE_BUCKET_RAW: raw-videos
      YTDLP_MAX_DURATION: 21600
      YTDLP_MAX_QUALITY: 1080p
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clip-internal
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "1G"

  # =========================================================================
  # WORKER: Transcribe (Faster Whisper + FFmpeg)
  # =========================================================================
  worker-transcribe:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker-transcribe
    container_name: clip-worker-transcribe
    restart: unless-stopped
    profiles: ["workers"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-clipuser}:${POSTGRES_PASSWORD:-clippass}@postgres:5432/${POSTGRES_DB:-clipdb}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      STORAGE_LOCAL_PATH: /app/storage
      STORAGE_BUCKET_RAW: raw-videos
      WHISPER_MODEL: large-v3
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_RUNNER: /app/apps/api/python/faster_whisper_runner.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
    networks:
      - clip-internal
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "6G"

  # =========================================================================
  # WORKER: Analyze (OpenAI GPT-4o)
  # =========================================================================
  worker-analyze:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker-analyze
    container_name: clip-worker-analyze
    restart: unless-stopped
    profiles: ["workers"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-clipuser}:${POSTGRES_PASSWORD:-clippass}@postgres:5432/${POSTGRES_DB:-clipdb}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      STORAGE_LOCAL_PATH: /app/storage
      STORAGE_BUCKET_CLIPS: clips
      STORAGE_BUCKET_SUBTITLES: subtitles
      STORAGE_BUCKET_THUMBNAILS: thumbnails
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_MODEL: gpt-4o
      OPENAI_MAX_TOKENS: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clip-internal

  # =========================================================================
  # WORKER: Clip Generation (FFmpeg rendering)
  # =========================================================================
  worker-clipgen:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker-clipgen
    container_name: clip-worker-clipgen
    restart: unless-stopped
    profiles: ["workers"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-clipuser}:${POSTGRES_PASSWORD:-clippass}@postgres:5432/${POSTGRES_DB:-clipdb}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      STORAGE_LOCAL_PATH: /app/storage
      STORAGE_BUCKET_RAW: raw-videos
      STORAGE_BUCKET_CLIPS: clips
      STORAGE_BUCKET_SUBTITLES: subtitles
      STORAGE_BUCKET_THUMBNAILS: thumbnails
      FFMPEG_THREADS: 2
      CLIP_MAX_CONCURRENT: 2
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2"
          memory: "1G"
    networks:
      - clip-internal

  # =========================================================================
  # WORKER: Cleanup (scheduled maintenance)
  # =========================================================================
  worker-cleanup:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker-cleanup
    container_name: clip-worker-cleanup
    restart: unless-stopped
    profiles: ["workers"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-clipuser}:${POSTGRES_PASSWORD:-clippass}@postgres:5432/${POSTGRES_DB:-clipdb}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      STORAGE_LOCAL_PATH: /app/storage
      STORAGE_BUCKET_RAW: raw-videos
      RAW_VIDEO_RETENTION_HOURS: 72
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clip-internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

# ===========================================================================
# NETWORKS
# ===========================================================================
networks:
  clip-internal:
    name: clip-internal
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: clip-br0
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ===========================================================================
# VOLUMES
# ===========================================================================
volumes:
  postgres_data:
    name: clip-postgres-data
  redis_data:
    name: clip-redis-data
