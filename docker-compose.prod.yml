# =============================================================================
# AI YouTube Auto Clipper — Production Docker Compose Override
# =============================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# This file overrides dev defaults with production settings.
# Secrets and sensitive config come from .env.production (never committed).
# =============================================================================

# =============================================================================
# NGINX Reverse Proxy
# =============================================================================
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: clip-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - caddy_data:/var/lib/caddy:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - clip-internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # =========================================================================
  # Production overrides for infrastructure services
  # =========================================================================

  postgres:
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # NOTE: In production, use managed PostgreSQL (RDS/Neon) instead of container
    # The containerized postgres is for development only.
    # In production, set DATABASE_URL to the managed service and remove this service.
    ports: []  # No public port exposure
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4G"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    restart: always
    # NOTE: In production, use managed Redis (Upstash/ElastiCache) instead of container
    # Set REDIS_URL to the managed service and remove this service.
    ports: []  # No public port exposure
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  minio:
    restart: always
    # NOTE: In production, replace with S3-compatible (AWS S3, Cloudflare R2, etc.)
    # Set STORAGE_* env vars to the managed service and remove MinIO entirely.
    # MinIO is for development/staging only.
    ports: []  # Console at 9001 also closed — use internal only
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # =========================================================================
  # Production overrides for application services
  # =========================================================================

  api:
    restart: always
    environment:
      NODE_ENV: production
    volumes: []  # No source mount in production
    ports: []  # API accessible only through nginx reverse proxy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: "512M"
        reservations:
          cpus: "0.5"
          memory: "256M"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  web:
    restart: always
    environment:
      NODE_ENV: production
    volumes: []  # No source mount in production
    ports: []  # Web accessible only through nginx reverse proxy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # =========================================================================
  # Workers
  # =========================================================================

  worker-download:
    # Workers don't need profiles in production — always run
    profiles: []
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  worker-transcribe:
    profiles: []
    restart: always
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "8G"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  worker-analyze:
    profiles: []
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512M"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  worker-clipgen:
    profiles: []
    restart: always
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "2"
          memory: "2G"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  worker-cleanup:
    profiles: []
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

# ===========================================================================
# Network — production isolation
# ===========================================================================
networks:
  clip-internal:
    driver_opts:
      com.docker.network.bridge.name: clip-br0
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ===========================================================================
# Volumes — production naming with labels
# ===========================================================================
volumes:
  postgres_data:
    name: clip-postgres-data
    labels:
      com.clipyai.backup: "true"
      com.clipyai.environment: "production"
  redis_data:
    name: clip-redis-data
    labels:
      com.clipyai.backup: "false"
      com.clipyai.environment: "production"
  minio_data:
    name: clip-minio-data
    labels:
      com.clipyai.backup: "true"
      com.clipyai.environment: "production"
  caddy_data:
    name: clip-nginx-data
